# Render Blueprint — one web service + a managed Postgres database.
# Deploy: render.com -> New + -> Blueprint -> pick this repo & branch.
databases:
  - name: fieldbook-db
    databaseName: fieldbook
    user: fieldbook
    plan: free

services:
  - type: web
    name: fieldbook
    runtime: node
    plan: free
    # --include=dev forces Vite (a devDependency) to install even though
    # NODE_ENV=production would otherwise skip it, so the client can build.
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: fieldbook-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      # Set after first deploy to your Render URL (used in email/SMS links).
      - key: APP_URL
        sync: false
      # Optional — leave blank to disable SMS/email; the app runs fine without.
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      - key: SENDGRID_API_KEY
        sync: false
      - key: SENDGRID_FROM_EMAIL
        sync: false
